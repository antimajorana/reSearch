[workspace]
resolver = "2"
exclude = ["vendor/webview2-com-sys"]
members = [
    "crates/policy",
    "crates/ledger",
    "crates/tools",
    "crates/research-tools",
    "crates/worker",
    "crates/agent",
    "crates/chatgpt-auth",
    "crates/export",
    "crates/desktop-server",
    "crates/mcp-server",
    "crates/cli-route",
    "crates/cli",
    "crates/desktop-app",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
zeroize = "1.9"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-extract = "0.12.1"
similar = "3.2.1"
regex = "1.13.2"
roxmltree = "0.21.2"
percent-encoding = "2.3.2"
httparse = "1.10.1"
tempfile = "3.27.0"
